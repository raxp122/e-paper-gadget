# Etere - configurazione
# Questo file sta nella partizione di boot della SD: puoi modificarlo anche
# dal PC con un lettore di schede. Le righe che iniziano con # sono ignorate.

# Sorgente: auto | csi | rssi | scan
SOURCE=auto

# Canale Wi-Fi (1-13) oppure auto = il piu' trafficato
CHANNEL=auto

# Secondi di "esposizione" tra uno scatto e l'altro (lo schermo resta fermo)
EXPOSURE_SECONDS=10
FIRST_EXPOSURE_SECONDS=5

# Pulizia dell'immagine: 0 = grezza ... 1 = molto pulita
CLEAN=0.6

# Versione del pannello scritta sull'etichetta dietro: V2, V3 o V4
EPD=V3

INVERT=0
ROTATE=0

# 1 = lascia acceso il Wi-Fi normale (SSH funziona, ma il canale non e' fisso)
# 0 = il gadget si prende la radio (cattura su un solo canale, niente SSH)
KEEP_WIFI=1
